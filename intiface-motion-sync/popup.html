<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>EdgeStation</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="dot" id="statusDot"></div>
    <div class="header-text">
      <div class="title">EdgeStation</div>
      <div class="subtitle" id="statusText">Disconnected</div>
    </div>
    <button id="popoutBtn" class="icon-btn" title="Open in its own window">⤢</button>
  </header>

  <section class="panel">
    <label class="field-label" for="wsUrl">Intiface server address</label>
    <div class="row">
      <input id="wsUrl" type="text" value="ws://127.0.0.1:12345" spellcheck="false" />
      <button id="connectBtn" class="btn primary">Connect</button>
    </div>
  </section>

  <section class="panel">
    <div class="meter-row">
      <div class="meter-label">Live intensity</div>
      <div class="meter-value" id="meterValue">0%</div>
    </div>
    <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
    <div class="sampling-row">
      <span class="sampling-dot" id="samplingDot"></span>
      <span id="samplingLabel">Sampling: nothing yet</span>
    </div>
  </section>

  <section class="panel">
    <div class="row space-between">
      <label class="field-label" style="margin-bottom:0;">Edging session</label>
      <span class="session-phase" id="sessionPhase">Idle</span>
    </div>
    <div class="row" style="margin-top:8px;">
      <input id="targetMinutes" type="number" min="1" max="180" value="15" />
      <span class="unit">min</span>
      <button id="sessionBtn" class="btn primary">Start</button>
    </div>
    <div class="meter-track session-track"><div class="meter-fill session-fill" id="sessionFill"></div></div>
    <div class="session-time" id="sessionTime">0:00 / 15:00</div>
    <div class="learning-status" id="learningStatus">No history yet — it'll learn your timing from Ease off presses.</div>
  </section>

  <section class="panel">
    <div class="row space-between">
      <span class="field-label">Sync active</span>
      <label class="switch">
        <input type="checkbox" id="masterEnabled" checked />
        <span class="slider-toggle"></span>
      </label>
    </div>
  </section>

  <section class="panel">
    <label class="field-label">Max intensity cap <span id="maxIntensityVal">80%</span></label>
    <input type="range" id="maxIntensity" min="0" max="100" value="80" />

    <label class="field-label">Sensitivity <span id="sensitivityVal">1.5x</span></label>
    <input type="range" id="sensitivity" min="0.2" max="3" step="0.1" value="1.5" />

    <label class="field-label">Smoothing <span id="smoothingVal">35%</span></label>
    <input type="range" id="smoothing" min="0" max="90" value="35" />
  </section>

  <section class="panel">
    <div class="field-label">Devices &amp; patterns</div>
    <div id="deviceList" class="device-list">
      <div class="empty-state">No devices yet — connect and scan in Intiface Central.</div>
    </div>
  </section>

  <button id="stopBtn" class="btn danger full">Stop now</button>
  <button id="easeBtn" class="btn ease full">Ease off</button>

  <script src="popup.js"></script>
</body>
</html>
